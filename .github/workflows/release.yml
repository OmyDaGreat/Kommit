name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Build and Test
    uses: ./.github/workflows/build-test.yml

  version:
    name: Determine Version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          git fetch --tags
          latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)

          if [ -z "$latest_tag" ]; then
            latest_version="0.1.0"
          else
            latest_version="${latest_tag#v}"
          fi

          IFS='.' read -r major minor patch <<< "$latest_version"

          case "${{ github.event.inputs.version_bump || 'patch' }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac

          new_version="$major.$minor.$patch"
          echo "New version: $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.native }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
            native: linux-x64
          - os: macos-latest
            target: macosArm64
            native: macos-arm64
          - os: windows-latest
            target: mingwX64
            native: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 27 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build native binary
        run: ./gradlew :app:linkReleaseExecutable${{ matrix.target }} -PkommitVersion=${{ needs.version.outputs.version }}

      - name: Package native binary
        working-directory: app/build/bin/${{ matrix.target }}/releaseExecutable
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -f app.exe ]; then
            mv app.exe kommit.exe
            7z a "$GITHUB_WORKSPACE/dist/kommit-${{ matrix.native }}.zip" kommit.exe
          else
            mv app.kexe kommit
            chmod +x kommit
            tar -czf "$GITHUB_WORKSPACE/dist/kommit-${{ matrix.native }}.tar.gz" kommit
          fi

      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: kommit-${{ matrix.native }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kommit-*
          path: dist
          merge-multiple: true

      - name: Generate Changelog
        id: changelog
        run: |
          latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)

          if [ -z "$latest_tag" ]; then
            range=HEAD
          else
            range="${latest_tag}..HEAD"
          fi

          changelog=$(git rev-list --reverse "$range" | while read -r sha; do
            printf '* %s\n' "$(git log -1 --format=%B "$sha" | head -n 1)"
          done)

          if [ -z "$changelog" ]; then
            changelog="No changes since last release"
          fi

          {
            echo 'changelog<<CHANGELOG_EOF'
            printf '%s\n' "$changelog"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Calculate SHA256 checksums
        id: checksums
        working-directory: dist
        run: |
          sha256sum kommit-*.tar.gz kommit-*.zip > checksums.txt
          cat checksums.txt
          {
            echo 'list<<CHECKSUMS_EOF'
            cat checksums.txt
            echo 'CHECKSUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Get release date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.VERSION }}
          body: |
            # Kommit ${{ env.VERSION }}

            Released on ${{ steps.date.outputs.date }}.

            Kommit is a Kotlin-based command-line tool that helps generate standardized conventional commit messages from a YAML configuration file.

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Using Homebrew (macOS/Linux)
            ```bash
            brew install OmyDaGreat/malefic/kommit
            ```

            ### Using Scoop (Windows)
            ```powershell
            scoop bucket add malefic https://github.com/OmyDaGreat/MaleficBucket
            scoop install kommit
            ```

            ### Manual Installation
            Download the archive for your platform, extract it, and put `kommit` (or `kommit.exe`) on your PATH:
            - **Linux x64**: [kommit-linux-x64.tar.gz](https://github.com/OmyDaGreat/Kommit/releases/download/${{ env.TAG }}/kommit-linux-x64.tar.gz)
            - **macOS ARM64**: [kommit-macos-arm64.tar.gz](https://github.com/OmyDaGreat/Kommit/releases/download/${{ env.TAG }}/kommit-macos-arm64.tar.gz)
            - **Windows x64**: [kommit-windows-x64.zip](https://github.com/OmyDaGreat/Kommit/releases/download/${{ env.TAG }}/kommit-windows-x64.zip)

            ## Verification

            ### SHA256 Checksums
            ```
            ${{ steps.checksums.outputs.list }}
            ```

            ## Documentation
            For more information, see the [README](https://github.com/OmyDaGreat/Kommit/blob/main/README.adoc).

            ## Feedback
            If you encounter any issues or have suggestions, please [open an issue](https://github.com/OmyDaGreat/Kommit/issues/new) on GitHub.
          draft: false
          prerelease: false
          files: |
            dist/*
            .kommit.yaml
            LICENSE
            README.adoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-managers:
    name: Update Homebrew Tap and Scoop Bucket
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASES: https://github.com/OmyDaGreat/Kommit/releases/download/${{ needs.version.outputs.tag }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
    steps:
      - name: Check for repository token
        id: token
        run: |
          if [ -z "$REPO_ACCESS_TOKEN" ]; then
            echo "::warning::REPO_ACCESS_TOKEN is not set; skipping Homebrew and Scoop updates."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download native binaries
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: kommit-*
          path: dist
          merge-multiple: true

      - name: Calculate SHA256 checksums
        if: steps.token.outputs.present == 'true'
        id: sha
        working-directory: dist
        run: |
          echo "linux_x64=$(sha256sum kommit-linux-x64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_arm64=$(sha256sum kommit-macos-arm64.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_x64=$(sha256sum kommit-windows-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/homebrew-malefic.git"
          cd homebrew-malefic
          mkdir -p Formula
          cat > Formula/kommit.rb << EOF
          class Kommit < Formula
            desc "Conventional commit message generator driven by a YAML config"
            homepage "https://github.com/OmyDaGreat/Kommit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${RELEASES}/kommit-macos-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.macos_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "${RELEASES}/kommit-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
            end

            def install
              bin.install "kommit"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kommit --version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kommit.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date."
          else
            git commit -m "kommit: update to ${VERSION}"
            git push
          fi

      - name: Update Scoop manifest
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/MaleficBucket.git"
          cd MaleficBucket
          mkdir -p bucket
          cat > bucket/kommit.json << EOF
          {
              "version": "${VERSION}",
              "description": "Conventional commit message generator driven by a YAML config",
              "homepage": "https://github.com/OmyDaGreat/Kommit",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "${RELEASES}/kommit-windows-x64.zip",
                      "hash": "${{ steps.sha.outputs.windows_x64 }}"
                  }
              },
              "bin": "kommit.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/OmyDaGreat/Kommit/releases/download/v\$version/kommit-windows-x64.zip"
                      }
                  }
              }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/kommit.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date."
          else
            git commit -m "kommit: update to ${VERSION}"
            git push
          fi
