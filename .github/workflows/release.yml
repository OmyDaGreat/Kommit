name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          # Get the latest tag or default to 0.1.0 if no tags exist
          git fetch --tags
          latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)

          if [ -z "$latest_tag" ]; then
            latest_version="0.1.0"
          else
            latest_version="${latest_tag#v}"
          fi

          # Split version into major, minor, patch
          IFS='.' read -r major minor patch <<< "$latest_version"

          # Bump version based on input or default to patch
          bump_type="${{ github.event.inputs.version_bump || 'patch' }}"

          if [ "$bump_type" == "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bump_type" == "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="$major.$minor.$patch"
          echo "New version: $new_version"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
            executable: app.kexe
            artifact: kommit-linux-x64
          - os: macos-latest
            target: macosArm64
            executable: app.kexe
            artifact: kommit-macos-arm64
          - os: windows-latest
            target: mingwX64
            executable: app.exe
            artifact: kommit-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 27 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@v2.1
      - name: Make Gradlew executable
        run: chmod +x gradlew
      - name: Build Native Binary
        run: ./gradlew :app:linkReleaseExecutable${{ matrix.target }} -PkommitVersion=${{ needs.version.outputs.version }}
      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp app/build/bin/${{ matrix.target }}/releaseExecutable/${{ matrix.executable }} dist/kommit${{ matrix.target == 'mingwX64' && '.exe' || '' }}
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/kommit${{ matrix.target == 'mingwX64' && '.exe' || '' }}
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        run: |
          latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)

          if [ -z "$latest_tag" ]; then
            echo "No previous tags found, including all commits in changelog"
            range=HEAD
          else
            echo "Getting commits since $latest_tag"
            range="${latest_tag}..HEAD"
          fi

          changelog=$(git rev-list --reverse "$range" | while read -r sha; do
            printf '* %s\n' "$(git log -1 --format=%B "$sha" | head -n 1)"
          done)

          if [ -z "$changelog" ]; then
            changelog="No changes since last release"
          fi

          {
            echo 'changelog<<CHANGELOG_EOF'
            printf '%s\n' "$changelog"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Release Files
        run: |
          mkdir -p release
          
          # Copy binaries and rename them appropriately
          cp artifacts/kommit-linux-x64/kommit release/kommit-linux-x64
          cp artifacts/kommit-macos-arm64/kommit release/kommit-macos-arm64
          cp artifacts/kommit-windows-x64/kommit.exe release/kommit-windows-x64.exe
          
          # Copy additional files if they exist
          cp LICENSE release/ || echo "LICENSE file not found"
          cp README.adoc release/ || echo "README.adoc file not found"
          cp .kommit.yaml release/ || echo ".kommit.yaml file not found"

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd release
          sha256sum kommit-linux-x64 > checksums.txt
          sha256sum kommit-macos-arm64 >> checksums.txt
          sha256sum kommit-windows-x64.exe >> checksums.txt
          
          # Get individual checksums for package managers
          linux_sha=$(sha256sum kommit-linux-x64 | awk '{print $1}')
          macos_arm64_sha=$(sha256sum kommit-macos-arm64 | awk '{print $1}')
          windows_sha=$(sha256sum kommit-windows-x64.exe | awk '{print $1}')
          
          echo "linux_sha256=$linux_sha" >> $GITHUB_OUTPUT
          echo "macos_arm64_sha256=$macos_arm64_sha" >> $GITHUB_OUTPUT
          echo "windows_sha256=$windows_sha" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: |
            # Kommit ${{ needs.version.outputs.version }}

            Released on ${{ steps.date.outputs.date }}.

            Kommit is a Kotlin-based command-line tool that helps generate standardized conventional commit messages from a YAML configuration file.

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Using Homebrew (macOS/Linux)
            ```bash
            brew tap OmyDaGreat/malefic
            brew install OmyDaGreat/malefic/kommit
            ```

            ### Using Scoop (Windows)
            ```powershell
            scoop bucket add malefic https://github.com/OmyDaGreat/MaleficBucket
            scoop install kommit
            ```

            ### Manual Installation
            Download the appropriate binary for your platform from the list below:
            - **Linux x64**: [kommit-linux-x64](https://github.com/OmyDaGreat/Kommit/releases/download/${{ needs.version.outputs.tag }}/kommit-linux-x64)
            - **macOS ARM64**: [kommit-macos-arm64](https://github.com/OmyDaGreat/Kommit/releases/download/${{ needs.version.outputs.tag }}/kommit-macos-arm64)
            - **Windows x64**: [kommit-windows-x64.exe](https://github.com/OmyDaGreat/Kommit/releases/download/${{ needs.version.outputs.tag }}/kommit-windows-x64.exe)

            ## Verification

            ### SHA256 Checksums
            ```
            Linux x64:   ${{ steps.checksums.outputs.linux_sha256 }}
            macOS ARM64: ${{ steps.checksums.outputs.macos_arm64_sha256 }}
            Windows x64: ${{ steps.checksums.outputs.windows_sha256 }}
            ```

            ## Documentation
            For more information, see the [README](https://github.com/OmyDaGreat/Kommit/blob/main/README.adoc).

            ## Feedback
            If you encounter any issues or have suggestions, please [open an issue](https://github.com/OmyDaGreat/Kommit/issues/new) on GitHub.
          draft: false
          prerelease: false
          files: |
            release/*

  package-managers:
    name: Update Homebrew Tap and Scoop Bucket
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASES: https://github.com/OmyDaGreat/Kommit/releases/download/${{ needs.version.outputs.tag }}
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
    steps:
      - name: Check for repository token
        id: token
        run: |
          if [ -z "$REPO_ACCESS_TOKEN" ]; then
            echo "::warning::REPO_ACCESS_TOKEN is not set; skipping Homebrew and Scoop updates."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download native binaries
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: kommit-*
          path: artifacts

      - name: Calculate SHA256 checksums
        if: steps.token.outputs.present == 'true'
        id: sha
        working-directory: artifacts
        run: |
          echo "linux_x64=$(sha256sum kommit-linux-x64/kommit | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_arm64=$(sha256sum kommit-macos-arm64/kommit | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_x64=$(sha256sum kommit-windows-x64/kommit.exe | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/homebrew-malefic.git"
          cd homebrew-malefic
          mkdir -p Formula
          cat > Formula/kommit.rb << EOF
          class Kommit < Formula
            desc "Conventional commit generator made with Kotlin"
            homepage "https://github.com/OmyDaGreat/Kommit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${RELEASES}/kommit-macos-arm64"
                sha256 "${{ steps.sha.outputs.macos_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "${RELEASES}/kommit-linux-x64"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
            end

            def install
              bin.install Dir["kommit-*"].first => "kommit"
            end

            test do
              system bin/"kommit", "--version"
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kommit.rb
          git commit -m "kommit: update to ${VERSION}"
          git push

      - name: Update Scoop manifest
        if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${REPO_ACCESS_TOKEN}@github.com/OmyDaGreat/MaleficBucket.git"
          cd MaleficBucket
          mkdir -p bucket
          cat > bucket/kommit.json << EOF
          {
              "version": "${VERSION}",
              "description": "A Kotlin-based conventional commit message generator",
              "homepage": "https://github.com/OmyDaGreat/Kommit",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "${RELEASES}/kommit-windows-x64.exe",
                      "hash": "${{ steps.sha.outputs.windows_x64 }}",
                      "bin": [["kommit-windows-x64.exe", "kommit"]]
                  }
              },
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/OmyDaGreat/Kommit/releases/download/v\$version/kommit-windows-x64.exe"
                      }
                  }
              }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/kommit.json
          git commit -m "kommit: update to ${VERSION}"
          git push
